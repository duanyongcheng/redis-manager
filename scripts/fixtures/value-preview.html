<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>业务申请表</title>
  <style>
    * { font-family: Arial, "宋体", serif; }
    body { margin: 28px; font-size: 14px; color: #20242b; background: white; }
    h3 { text-align: center; font-size: 20px; margin: 0 0 18px; }
    .intro { text-align: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; border: 1pt solid black; }
    td { border: 1pt solid black; padding: 8px 12px; }
    .label { width: 28%; background: #eeece1; font-weight: bold; }
    .section { background: #eeece1; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <h3>认/申购交易业务申请表</h3>
  <p class="intro">${(invOrgInvestorFundProdId&gt;0)?string('产品投资者','机构投资者')}</p>
  <table cellspacing="0" cellpadding="0" align="center">
    <tr><td class="label">产品名称</td><td>${fundName!""}</td></tr>
    <tr><td class="label">产品代码</td><td>${fundCode!""}</td></tr>
    <tr><td class="section" colspan="2">（一）基本信息</td></tr>
    <tr><td class="label">投资者名称</td><td>${investorName!""}</td></tr>
    <tr><td class="label">申请日期</td><td>${applyDate!""}</td></tr>
  </table>
  <p>模板字段保持原样；这是用于验证预览的示例数据。</p>
  <script>document.body.dataset.previewScriptRan = "yes";</script>
</body>
</html>
