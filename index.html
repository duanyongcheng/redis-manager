<!doctype html>
<html lang="zh-CN" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfc" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.4' fill='%23ffffff'/%3E%3Crect x='3' y='3' width='18' height='18' rx='3.2' fill='%2316191c'/%3E%3Crect x='4.5' y='4.5' width='15' height='15' rx='1.8' fill='%23ffffff'/%3E%3Crect x='7.5' y='9' width='9' height='1.5' rx='0.25' fill='%2316191c'/%3E%3Crect x='7.5' y='13.5' width='9' height='1.5' rx='0.25' fill='%230f8f9e'/%3E%3C/svg%3E" />
    <script>
      try {
        var raw = localStorage.getItem("redis-manager.settings.v3") || localStorage.getItem("redis-manager.settings.v2");
        if (raw) {
          var parsed = JSON.parse(raw);
          var scheme = parsed && (parsed.scheme === "dark" || parsed.scheme === "light") ? parsed.scheme : null;
          if (scheme) {
            document.documentElement.dataset.scheme = scheme;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", scheme === "dark" ? "#101417" : "#fbfbfc");
          }
        }
      } catch (_err) {}
    </script>
    <title>Redis Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
